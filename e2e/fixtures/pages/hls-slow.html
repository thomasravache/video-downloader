<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Player HLS com servidor lento</title>
  </head>
  <body>
    <h1>Player HLS com servidor lento</h1>
    <script>
      // O master vem de outro servidor local (com atraso nos segmentos): ?src=<url do master>.
      fetch(new URLSearchParams(location.search).get('src'))
        .then((response) => response.text())
        .then(() => {
          document.body.dataset.fetched = 'done';
        })
        .catch(() => {
          document.body.dataset.fetched = 'error';
        });
    </script>
  </body>
</html>
