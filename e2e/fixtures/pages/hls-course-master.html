<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Aula de curso com dois idiomas</title>
  </head>
  <body>
    <h1>Aula de curso com dois idiomas</h1>
    <!-- Só a master (sem <video>): o popup resolve e oferece o seletor de áudio (SPEC-0015:E2E-02). -->
    <script>
      fetch('/hls/course/master.m3u8')
        .then((response) => response.text())
        .then(() => {
          document.body.dataset.fetched = 'done';
        })
        .catch(() => {
          document.body.dataset.fetched = 'error';
        });
    </script>
  </body>
</html>
