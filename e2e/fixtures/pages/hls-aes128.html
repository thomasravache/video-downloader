<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Player HLS AES-128</title>
  </head>
  <body>
    <h1>Player HLS AES-128</h1>
    <script>
      fetch('/hls/aes128/master.m3u8')
        .then((response) => response.text())
        .then(() => {
          document.body.dataset.fetched = 'done';
        })
        .catch(() => {
          document.body.dataset.fetched = 'error';
        });
    </script>
  </body>
</html>
