<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Aula com áudio criptografado</title>
  </head>
  <body>
    <h1>Aula com áudio criptografado</h1>
    <script>
      fetch('/hls/split-av/master-enc-audio.m3u8')
        .then((response) => response.text())
        .then(() => {
          document.body.dataset.fetched = 'done';
        })
        .catch(() => {
          document.body.dataset.fetched = 'error';
        });
    </script>
  </body>
</html>
