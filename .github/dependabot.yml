version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # O pr-check do SDD exige spec no PR; atualização de dependência não muda comportamento.
    commit-message:
      prefix: "build(deps) [no-spec]"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # O pr-check do SDD exige spec no PR; atualização de dependência não muda comportamento.
    commit-message:
      prefix: "build(deps) [no-spec]"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
